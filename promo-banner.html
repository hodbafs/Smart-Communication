<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Communication - โฆษณา</title>
    <meta name="description" content="เตรียมตัวพบกับหลักสูตร Smart Communication และการลงทะเบียนแบบใหม่เร็วๆ นี้">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Kanit:wght@200;300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .promo-container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .promo-title {
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .promo-link {
            display: inline-block;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 40px rgba(0, 229, 255, 0.1);
            border: 2px solid rgba(0, 229, 255, 0.15);
        }

        .promo-link:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 80px rgba(0, 229, 255, 0.25);
            border-color: rgba(0, 229, 255, 0.5);
        }

        .promo-link::after {
            content: '🔗 คลิกเพื่อดูรายละเอียดหลักสูตร Smart Communication';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(5, 8, 16, 0.95));
            color: #00e5ff;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .promo-link:hover::after {
            opacity: 1;
        }

        .promo-link img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Shimmer effect */
        .promo-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.06), transparent);
            z-index: 2;
            animation: promoShimmer 4s ease-in-out infinite;
        }

        @keyframes promoShimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .promo-cta {
            margin-top: 24px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            animation: ctaPulse 2s ease-in-out infinite;
        }

        @keyframes ctaPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; color: #00e5ff; }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(0, 229, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="promo-container">
        <p class="promo-title">📢 ประกาศสำคัญจากฝ่ายพัฒนาบุคลากร</p>
        
        <!-- Promo Banner - Clickable to Landing Page -->
        <a href="coming-soon.html" class="promo-link" id="promoLink" title="เตรียมตัวพบกับหลักสูตร Smart Communication และการลงทะเบียนแบบใหม่เร็วๆ นี้">
            <img src="assets/promo_banner.png" alt="เตรียมตัวพบกับหลักสูตร Smart Communication และการลงทะเบียนแบบใหม่เร็วๆ นี้" loading="eager" fetchpriority="high">
        </a>
        
        <p class="promo-cta">▲ Click Banner ▲</p>
    </div>

    <script>
        // Add floating particles
        for (let i = 0; i < 15; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 10 + 8) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
